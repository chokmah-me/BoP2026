name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No dependencies to install — the engine is vanilla JS loaded via a VM
      # context. npm test runs the headless Node regression tests.
      - run: npm test
